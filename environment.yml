# Shared conda environment for the bike demand pipeline: conda env create -f environment.yml
name: bike-demand
channels:
  - conda-forge
dependencies:
  - python=3.12
# pipeline: imported by src/
  - pandas
  - numpy
  - scikit-learn
  - joblib
# development tools: check the code, not needed to run it
  - pytest
  - pytest-cov
  - flake8
# notebook tools: notebooks/ only, never imported in src/
  - matplotlib
  - ipykernel


