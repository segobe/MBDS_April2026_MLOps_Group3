# pytest.ini  [Test runner settings]
[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = .
norecursedirs = notebooks data models reports logs wandb .git __pycache__
# Use disposable, repo-local test files to avoid some Windows temp permission issues.
# pytest clears ONLY the dedicated .pytest-tmp folder before each run. It sits in the repo root
# because pytest does not create missing parent folders (a fresh clone has no .pytest_cache/).
# Admin must verify .gitignore excludes .pytest-tmp/
addopts = -q --basetemp=.pytest-tmp
