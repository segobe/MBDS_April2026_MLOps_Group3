# pytest.ini  [Test runner settings]
[pytest]
testpaths = tests
python_files = test_*.py
pythonpath = .
norecursedirs = notebooks data models reports logs wandb .git __pycache__
# Use disposable, repo-local test files to avoid some Windows temp permission issues.
# pytest clears ONLY the dedicated pytest-tmp folder before each run.
# Admin must verify .gitignore excludes .pytest_cache/
addopts = -q --basetemp=.pytest_cache/pytest-tmp
